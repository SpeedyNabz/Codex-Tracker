[package]
# Defines the Rust/Tauri package that provides the Codex Tracker native shell
# and its backend dependencies. Made by Heavymask — https://heavymask.com
name = "codex-tracker"
version = "0.1.0"
license = "Apache-2.0"
description = "A live Codex allowance and token-activity overlay for Windows, made by HeavyMask"
authors = ["HeavyMask"]
homepage = "https://heavymask.com"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codex_usage_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
